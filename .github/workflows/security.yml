name: Security and lifecycle checks

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci
      - run: npm run test:security
      - run: npm audit --omit=dev --audit-level=high
      - name: Build and check the production runtime
        run: |
          docker build --pull --tag "uhrp-security-ci:$GITHUB_SHA" .
          docker run --rm --network none --entrypoint node "uhrp-security-ci:$GITHUB_SHA" -e '
            const assert = require("node:assert/strict");
            const fs = require("node:fs");
            require("@bsv/sdk");
            assert.equal(process.getuid(), 10001);
            assert.equal(fs.existsSync("/usr/local/bin/npm"), false);
            assert.equal(fs.existsSync("/usr/local/lib/node_modules/npm"), false);
          '
